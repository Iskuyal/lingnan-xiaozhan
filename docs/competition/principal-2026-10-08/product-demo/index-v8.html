function reduce(s,action,payload={}){
 s=structuredClone(s);
 switch(action){
 case 'home':s.route='home';s.modal='';s.toast='';break;
 case 'timetable':s.route=s.saved.length?'week':'empty';s.modal='';break;
 case 'import':s.route='import';break;
 case 'picker':s.modal='picker';break;
 case 'parse':s.modal='';s.route='processing';break;
 case 'draft':s.route='draft';s.draft=structuredClone(originalCourses);break;
 case 'edit':s.modal='edit';s.location=s.draft.find(c=>c.id===2).location;break;
 case 'typeLocation':s.location=payload.text??'B305';break;
 case 'editSave':s.draft.find(c=>c.id===2).location=s.location;s.modal='';break;
 case 'saveConfirm':s.modal='saveConfirm';break;
 case 'save':s.saved=structuredClone(s.draft);s.route='week';s.modal='';s.toast='课表已保存 · 6门课程';break;
 case 'nextWeek':s.week++;s.toast='';break;
 case 'previousWeek':s.week=Math.max(1,s.week-1);s.toast='';break;
 case 'calendar':s.route='calendar';s.modal='';break;
 case 'settings':s.modal='settings';break;
 case 'saveSettings':s.modal='';s.toast='演示设置已保存';break;
 case 'manualAdd':s.modal='manual';break;
 case 'saveManual':s.saved.push({id:100+s.saved.length,name:payload.name||'自主学习',location:payload.location||'B301',day:3,start:9,end:10,color:'blue'});s.route='week';s.modal='';s.toast='已新增演示课程';break;
 case 'courseDetail':s.modal='course';break;
 case 'close':s.modal='';break;
 case 'aiOpen':s.modal='chat';s.messages=[];s.input='';s.toast='';break;
 case 'typeQuery':case 'typeAdd':case 'typeDept':s.input=payload.text??'';break;
 case 'sendQuery':case 'sendAdd':case 'sendDept':s.messages.push({role:'user',text:s.input});s.input='';s.thinking=true;break;
 case 'answerQuery':s.thinking=false;s.messages.push({role:'assistant',text:'第5周星期三，第5–6节有数据库应用，地点B305。',source:'依据：已保存的个人课表'});break;
 case 'proposal':s.thinking=false;s.proposal=structuredClone(newCourse);s.messages.push({role:'assistant',text:'可以新增这门课程。请先核对下面的变更提案。'});break;
 case 'apply':if(s.proposal){s.saved.push(s.proposal);s.proposal=null;}s.modal='';s.route='week';s.toast='已按确认内容新增 · 共7门课程';break;
 case 'cancelProposal':s.proposal=null;s.messages.push({role:'assistant',text:'已取消这次改动，课表没有变化。'});break;
 case 'departments':s.route='departments';s.modal='';break;
 case 'department':s.route='department';break;
 case 'deptChat':s.modal='deptChat';s.messages=[];s.input='';break;
 case 'answerDept':s.thinking=false;s.messages.push({role:'assistant',text:'官网未公布该组织的联系方式。你可以查看组织资料与官网原文，不补猜联系电话。',source:'依据：已登记的组织资料 · 示例响应'});break;
 case 'news':s.route='news';s.modal='';break;
 case 'article':s.route='article';s.articleScroll=false;break;
 case 'scrollArticle':s.articleScroll=true;break;
 case 'copySource':s.toast='原文来源链接已复制（演示）';break;
 case 'goals':s.route='goals';s.modal='';s.toast='';break;
 case 'goalForm':s.modal='goal';break;
 case 'goalSaved':s.goal=true;s.modal='';s.toast='目标日已保存 · 演示内存数据';break;
 case 'fitness':s.route='fitness';s.modal='';s.toast='';break;
 case 'fitnessResult':s.fitness=true;break;
 case 'advancement':s.route='advancement';s.modal='';break;
 case 'clarify':s.clarify=true;break;
 default:throw new Error('Unknown demo action: '+action);
 }
 return s;
}

 if(s.modal==='goal')body=`<div class="sheet-title">新增目标日</div><div class="form-label">目标名称</div><div class="field">项目展示</div><div class="form-label">日期</div><div class="field">2026-10-10</div><div class="notice">这是个人设定的节点，不是官方安排。</div>${button('goal-save','goalSaved','保存目标日')}`;
 if(['chat','deptChat'].includes(s.modal)){
 const messages=s.messages.slice(-3);body=`<div class="sheet-title">${s.modal==='chat'?'课表助手':'部门答疑'} <span class="tiny">模拟响应</span></div>${messages.length?'':'<div class="bubble">'+(s.modal==='chat'?'可以查课或提出新增、修改要求。课程变更先核对，再由你确认。':'围绕已登记的学生组织资料提问，未公布的信息会明确说明。')+'</div>'}${messages.map(m=>`<div class="bubble ${m.role==='user'?'user':''}">${m.source?'<div class="answer-label">'+m.source+'</div>':''}${escapeHtml(m.text)}</div>`).join('')}${s.thinking?`<div class="thinking">正在整理${s.modal==='chat'?'课表':'资料'}${'.'.repeat(1+Math.floor(t*2)%3)}</div>`:''}${s.proposal?`<div class="proposal"><div class="proposal-title">待确认：新增课程</div><div>课程：项目实践</div><div>星期四 · 第9–10节 · 第1–16周</div><div>地点：B408</div><div class="form-actions">${button('cancel-course','cancelProposal','取消','secondary')}${button('apply-course','apply','确认新增')}</div></div>`:`<div class="chat-question"><input id="chat-input" class="field" value="${escapeHtml(s.input)}" placeholder="输入你的问题">${button('chat-send',s.modal==='deptChat'?'sendDept':s.input.includes('项目实践')?'sendAdd':'sendQuery','发送','')}</div>`}<div class="tiny" style="margin-top:8px">代码演示使用固定示例响应，不调用真实模型。</div>`;
 }
 return `<div class="sheet-shadow"></div><div class="sheet">${body}</div>`;
}
const titles={home:'校园工具',empty:'我的课表',import:'导入课表',processing:'导入课表',draft:'导入课表',week:'我的课表',departments:'学生部门',department:'部门详情',news:'校园资讯',article:'资讯详情',goals:'目标日',calendar:'校历与考试',fitness:'体测估算',advancement:'升学与实习问答'};
let currentTime=0,state=initialState(),playing=false,manual=false,origin=0;
const soundtrack=document.getElementById('soundtrack');
if(!new URLSearchParams(location.search).has('export'))soundtrack.src='../校园工具-代码产品演示-v4.mp4';
function ease(x){return x<=0?0:x>=1?1:1-Math.pow(1-x,3);}
function stateAt(t){let s=initialState();let lastRouteEvent=0;for(const e of events){if(e.at>t)break;const prevRoute=s.route,prevModal=s.modal;let text=e.text;
 if(e.action.startsWith('type')){const duration=e.action==='typeAdd'?3.3:e.action==='typeDept'?1.5:1.9;text=text.slice(0,Math.ceil(text.length*Math.min(1,(t-e.at)/duration)));}
 s=reduce(s,e.action,{text});if(s.route!==prevRoute||s.modal!==prevModal)lastRouteEvent=e.at;
 }
 if(s.toast){const toastEvent=[...events].reverse().find(e=>e.at<=t&&['save','apply','copySource','goalSaved'].includes(e.action));if(toastEvent&&t-toastEvent.at>2.6)s.toast='';}
 return {s,lastRouteEvent};}
function render(t,manualState=null){t=Math.max(0,Math.min(DURATION,t));currentTime=t;const snapshot=stateAt(t);state=manualState||snapshot.s;
 const ch=chapters.filter(c=>c.at<=t).at(-1);document.getElementById('label').textContent=ch.label;document.getElementById('headline').textContent=ch.title;document.getElementById('subcopy').innerHTML=escapeHtml(ch.copy).replaceAll('\n','<br>');document.getElementById('detail').textContent=ch.detail;
 const enter=ease((t-ch.at)/.7);for(const id of ['label','headline','subcopy','detail']){const el=document.getElementById(id);el.style.opacity=enter;el.style.transform=`translateY(${(1-enter)*20}px)`;}
 const cam=ease((t-1.5)/3.5),phone=document.getElementById('phone');const focus=(t>=18&&t<33)||(t>=44&&t<67);const focusAge=focus?t-(t<33?18:44):0;const boost=focus?.045*ease(focusAge/1.2):0;phone.style.left=(594+(1045-594)*cam-boost*200)+'px';phone.style.transform=`translateY(${Math.sin(t*.35)*2}px) scale(${1.025-(.025*cam)+boost}) rotate(${(1-cam)*-3}deg)`;
 if(t<5){const intro=1-ease((t-1.5)/3.5);document.getElementById('headline').style.opacity=1-intro;document.getElementById('subcopy').style.opacity=1-intro;document.getElementById('detail').style.opacity=1-intro;document.getElementById('label').style.opacity=1-intro;}
 document.getElementById('nav-title').textContent=titles[state.route];
 const age=t-snapshot.lastRouteEvent,appEnter=ease(age/.4);document.getElementById('viewport').innerHTML=`<div class="app-page" style="transform:translateY(${(1-appEnter)*16}px);opacity:${appEnter}">${content(state,t)}</div>${modal(state,t)}${state.toast?'<div class="toast">'+state.toast+'</div>':''}`;
 if(state.route==='article'&&state.articleScroll){const start=90,amt=ease((t-start)/1.3);document.querySelector('.page-inner').style.transform=`translateY(-${150*amt}px)`;}
 const caption=captions.find(c=>t>=c.from&&t<c.to);document.getElementById('caption').textContent=caption?.text||'';
 document.getElementById('progress').style.width=100*t/DURATION+'%';document.getElementById('seek').value=t;document.getElementById('clock').textContent=`${Math.floor(t/60)}:${String(Math.floor(t)%60).padStart(2,'0')} / 3:54`;
 const end=document.getElementById('end');end.style.display=t>=108?'flex':'none';end.style.opacity=ease((t-108)/.8);
 document.getElementById('pointer').style.display='none';document.getElementById('ripple').style.display='none';
 const next=events.find(e=>e.at>t&&e.target);if(next&&next.at-t<1.35&&next.at-t>.04&&!manual){const target=document.getElementById(next.target);if(target){const r=target.getBoundingClientRect(),st=document.getElementById('stage').getBoundingClientRect(),scale=st.width/1600;const x=(r.left+r.width/2-st.left)/scale,y=(r.top+r.height/2-st.top)/scale;const arrival=ease((1.35-(next.at-t))/.7),p=document.getElementById('pointer');p.style.display='block';p.style.left=x+45*(1-arrival)+'px';p.style.top=y+70*(1-arrival)+'px';p.style.opacity=arrival;const pulse=next.at-t<.3,ring=document.getElementById('ripple');if(pulse){const rad=50+(1-(next.at-t)/.3)*65;ring.style.display='block';ring.style.left=x-rad/2+'px';ring.style.top=y-rad/2+'px';ring.style.width=rad+'px';ring.style.height=rad+'px';ring.style.opacity=(next.at-t)/.3;}}}
 return {route:state.route,modal:state.modal,courses:state.saved.length,draft:state.draft.length,input:state.input,week:state.week};
}
function dispatch(action){manual=true;playing=false;soundtrack.pause();document.getElementById('play').textContent='播放';if(action==='editSave')state.location=document.getElementById('location-input')?.value||state.location;if(action.startsWith('send'))state.input=document.getElementById('chat-input')?.value||state.input;const payload={name:document.getElementById('manual-name')?.value,location:document.getElementById('manual-location')?.value};state=reduce(state,action,payload);render(currentTime,state);}
document.getElementById('viewport').addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(button)dispatch(button.dataset.action);});
document.getElementById('nav-back').addEventListener('click',()=>dispatch('home'));
function startAudio(t){if(soundtrack.readyState>=1){soundtrack.currentTime=t;soundtrack.play().catch(()=>{});}}
function tick(now){if(playing){const t=!soundtrack.paused&&soundtrack.readyState>=2?soundtrack.currentTime:(now-origin)/1000;render(t);if(t>=DURATION-.04){playing=false;soundtrack.pause();document.getElementById('play').textContent='播放';}}requestAnimationFrame(tick);}
document.getElementById('play').onclick=()=>{playing=!playing;manual=false;origin=performance.now()-currentTime*1000;if(playing)startAudio(currentTime);else soundtrack.pause();document.getElementById('play').textContent=playing?'暂停':'播放';};
document.getElementById('restart').onclick=()=>{manual=false;playing=true;origin=performance.now();render(0);startAudio(0);document.getElementById('play').textContent='暂停';};
document.getElementById('seek').oninput=e=>{playing=false;manual=false;soundtrack.pause();render(Number(e.target.value));document.getElementById('play').textContent='播放';};
function resize(){const scale=Math.min(innerWidth/1600,(innerHeight-55)/900);const stage=document.getElementById('stage');stage.style.transform=`scale(${scale})`;stage.style.marginLeft=Math.max(0,(innerWidth-1600*scale)/2)+'px';}
window.renderAt=t=>{playing=false;manual=false;return render(t);};window.getDemoState=()=>structuredClone(state);window.demoDispatch=dispatch;window.demoDuration=DURATION;window.demoEvents=events;window.demoVoices=voices;
if(new URLSearchParams(location.search).has('export')){document.body.classList.add('export');document.getElementById('stage').style.transform='none';}else{resize();window.addEventListener('resize',resize);}
render(0);requestAnimationFrame(tick);
</script>
