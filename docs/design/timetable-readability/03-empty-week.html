<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课表 · 本周无课且未设学期</title>
  <link rel="stylesheet" href="_tokens.css">
  <link rel="stylesheet" href="_mockup.css">
  <style>
    .tt-top { display:flex; align-items:center; justify-content:space-between; }
    .tt-settings { min-height:44px; display:flex; align-items:center; color:var(--brand-ink); font-size:11px; }
    .week-switch { margin-top:6px; display:flex; align-items:center; justify-content:center; gap:10px; }
    .week-switch button { width:44px; height:44px; border:1px solid rgba(43,36,34,.18); color:var(--brand-deep); font-size:18px; }
    /* 周次行三件挨在一起：翻周箭头与选择器都不撑满整行（原生按钮自带 auto 外边距会把人推开）。 */
    .week-main { flex:0 1 auto; min-width:0; }
    .week-label { color:var(--brand-deep); font-size:25px; line-height:1.25; font-weight:700; }
    .tt-meta { margin-top:6px; color:var(--text-2); font-size:11px; text-align:center; }

    /* 退化提示：只在缺开学日/作息时出现；文案说清缺什么、点哪里补。 */
    .setup-hint { margin-top:14px; padding:10px 11px; display:flex; align-items:center; gap:12px; border-left:3px solid var(--gold); background:var(--paper-shade); }
    .setup-hint p { flex:1; margin:0; color:var(--text-2); font-size:11px; line-height:1.65; }
    .setup-hint a { flex:none; color:var(--brand-ink); font-size:11px; font-weight:700; }

    .week-section { margin-top:20px; padding-top:12px; border-top:2px solid var(--brand); display:flex; align-items:center; justify-content:space-between; }
    .switch { display:flex; border:1px solid rgba(43,36,34,.17); }
    .switch span { min-width:44px; min-height:44px; padding:4px 9px; display:flex; align-items:center; justify-content:center; color:var(--text-2); font-size:10px; }
    .switch .on { background:var(--brand); color:#fff; }

    .week-empty { margin-top:14px; padding:15px 13px 16px; border-left:3px solid var(--gold); background:var(--paper-shade); }
    .week-empty-title { color:var(--brand-deep); font-size:17px; line-height:1.4; font-weight:700; }
    .week-empty-copy { margin-top:5px; color:var(--text-2); font-size:12px; line-height:1.7; }

    .tt-actions { margin:17px -18px 0; padding:11px 18px; display:grid; grid-template-columns:repeat(3,1fr); gap:7px; border-top:1px solid rgba(43,36,34,.15); }
    .tt-actions button { min-height:44px; border:1px solid rgba(43,36,34,.2); color:var(--brand-ink); font-size:11px; }
    .tt-assistant { margin:11px 0 0; width:100%; justify-content:center; font-size:15px; }
  </style>
</head>
<body>
  <div class="statusbar"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi"></span><span class="battery"></span></span></div>
  <div class="navbar"><span class="nav-back">‹</span><span class="nav-title">我的课表</span><span class="nav-capsule"><i></i><i></i><b></b></span></div>
  <main class="page">
    <div class="tt-top"><span class="eyebrow">2026-2027 学年第一学期 · 按节次展示</span><span class="tt-settings">课表设置</span></div>
    <div class="week-switch"><button>‹</button><div class="week-main"><div class="week-label">第 1 周　⌄</div></div><button>›</button></div>
    <div class="tt-meta">本周 0 门 · 共 50 门课程</div>

    <div class="setup-hint"><p>还没设置开学日与作息时间。设置后才知道今天是第几周，也才能显示「正在上/下一节」。</p><a>去设置</a></div>

    <div class="week-section"><span class="section-title">本周课表</span><span class="switch"><span class="on">课表</span><span>列表</span></span></div>

    <section class="week-empty">
      <div class="week-empty-title">本周没有安排课程</div>
      <div class="week-empty-copy">可以左右翻周查看其他周次。</div>
    </section>

    <div class="quiet" style="margin-top:12px">周课表按节次展示；学校作息未核实，不显示具体时刻。课表保存于 2026-09-24 16:34。</div>

    <div class="tt-actions"><button>导入课表</button><button>手工新增</button><button>课程管理</button></div>
    <button class="primary tt-assistant">问问课表助手</button>
    <div class="back-link">返回首页</div>
  </main>
</body>
</html>
