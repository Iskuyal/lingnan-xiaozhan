<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>截图识别失败</title>
  <link rel="stylesheet" href="_tokens.css">
  <link rel="stylesheet" href="_mockup.css">
  <style>
    .error-head { margin-top:14px; padding-bottom:13px; border-bottom:2px solid var(--gold); }
    .error-title { margin-top:5px; color:var(--text); font-size:22px; line-height:1.4; font-weight:700; }
    .error-details { margin-top:14px; }
    .error-actions { display:flex; flex-direction:column; gap:8px; margin-top:15px; }
    .error-actions button { width:100%; }
  </style>
</head>
<body>
  <div class="statusbar"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi"></span><span class="battery"></span></span></div>
  <div class="navbar"><span class="nav-back">‹</span><span class="nav-title">截图识别</span><span class="nav-capsule"><i></i><i></i><b></b></span></div>
  <main class="page">
    <header class="error-head"><div class="eyebrow">截图识别结果</div><h1 class="error-title">这张图片没有识别成功</h1></header>
    <div class="warn-block error-details">图片里的星期、节次或课程内容无法可靠确认。没有写入任何课表数据，已有课表保持不变。</div>
    <p class="copy" style="margin-top:13px">可以换一张更清晰的截图重试，也可以使用教务系统导出的文件或手工录入。</p>
    <div class="error-actions"><button class="primary" style="justify-content:center">重试识别</button><button class="secondary">改用文件导入</button><button class="secondary">手工录入课程</button><button class="secondary">返回课表</button></div>
    <div class="quiet" style="margin-top:13px">识别不确定的内容会留空标记，不会猜课程信息。</div>
  </main>
</body>
</html>
