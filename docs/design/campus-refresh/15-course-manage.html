<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课程管理</title>
  <link rel="stylesheet" href="_tokens.css">
  <link rel="stylesheet" href="_mockup.css">
  <style>
    .manage-head { margin:2px 0 15px; display:flex; align-items:stretch; gap:13px; }
    .manage-total { flex:1; display:flex; align-items:center; gap:9px; padding:9px 11px; border-left:4px solid var(--gold); background:var(--paper-shade); color:var(--text-2); font-size:11px; }
    .manage-total strong { color:var(--brand-deep); font-size:29px; line-height:1; }
    .manage-total-copy { font-size:11px; line-height:1.35; }
    .manage-side { min-width:104px; display:flex; flex-direction:column; justify-content:center; }
    .manage-side div { display:flex; justify-content:space-between; gap:7px; padding:3px 0; border-bottom:1px solid rgba(43,36,34,.13); color:var(--text-2); font-size:10px; }
    .manage-side b { color:var(--brand-deep); }
    .filters { margin-top:13px; display:flex; gap:5px; overflow:hidden; }
    .filters span { min-height:44px; white-space:nowrap; padding:5px 8px; display:flex; align-items:center; border:1px solid rgba(43,36,34,.17); color:var(--text-2); font-size:9px; }
    .filters .on { border-color:var(--brand); background:var(--brand); color:#fff; }
    .manage-row { min-height:61px; display:grid; grid-template-columns:18px 4px 1fr 16px; gap:8px; align-items:center; border-bottom:1px solid rgba(43,36,34,.14); }
    .check { width:16px; height:16px; border:1px solid rgba(43,36,34,.32); }
    .manage-stripe { height:37px; background:var(--course); }
    .manage-name { font-size:11px; font-weight:700; line-height:1.45; }
    .manage-sub { color:var(--text-2); font-size:10px; }
    .manage-arrow { color:var(--gold-deep); font-size:15px; }
    .manage-actions { margin:15px -18px 0; padding:10px 18px; display:flex; align-items:center; justify-content:space-between; border-top:1px solid rgba(43,36,34,.17); background:var(--paper-shade); }
    .manage-actions span { color:var(--text-2); font-size:10px; }
    .manage-actions button { min-height:37px; padding:0 12px; border:1px solid var(--warn-line); color:var(--warn); background:transparent; font-size:10px; }
  </style>
</head>
<body>
  <div class="statusbar"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi"></span><span class="battery"></span></span></div>
  <div class="navbar"><span class="nav-back">‹</span><span class="nav-title">课程管理</span><span class="nav-capsule"><i></i><i></i><b></b></span></div>
  <main class="page">
    <header class="manage-head"><div class="manage-total"><strong>45</strong><span class="manage-total-copy">门课程<br><span class="quiet">已保存课表</span></span></div><div class="manage-side"><div><span>本周开课</span><b>14 门</b></div><div><span>待核对</span><b>1 门</b></div></div></header>
    <div class="filters"><span class="on">全部 45</span><span>待核对 1</span><span>手工 1</span><span>导入 44</span></div>
    <div class="manage-row"><i class="check"></i><i class="manage-stripe c1"></i><div><div class="manage-name">劳动教育（一）</div><div class="manage-sub">星期一 · 第 1-4 节 · 第 4 周</div></div><span class="manage-arrow">›</span></div>
    <div class="manage-row"><i class="check"></i><i class="manage-stripe c2"></i><div><div class="manage-name">高等数学</div><div class="manage-sub">星期二 · 第 5-6 节 · 第 4-5、7-16 周</div></div><span class="manage-arrow">›</span></div>
    <div class="manage-row"><i class="check"></i><i class="manage-stripe c3"></i><div><div class="manage-name">中华传统文化精粹（一）</div><div class="manage-sub">星期二 · 第 7-8 节</div></div><span class="manage-arrow">›</span></div>
    <div class="manage-row"><i class="check"></i><i class="manage-stripe c4"></i><div><div class="manage-name">体育（三） <span class="chip chip-warn">待核对</span></div><div class="manage-sub">星期四 · 第 3-4 节</div></div><span class="manage-arrow">›</span></div>
    <div class="manage-row"><i class="check"></i><i class="manage-stripe c5"></i><div><div class="manage-name">我的大学生活我做主 <span class="chip">手工</span></div><div class="manage-sub">第 3-4 节 · 第 1-16 周</div></div><span class="manage-arrow">›</span></div>
    <div class="manage-actions"><span>已选择 0 门</span><button>删除所选</button></div>
    <div class="quiet" style="margin-top:12px">点课程可修改；批量删除前会再次确认。</div>
  </main>
</body>
</html>
