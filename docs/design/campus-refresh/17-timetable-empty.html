<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>空课表</title>
  <link rel="stylesheet" href="_tokens.css">
  <link rel="stylesheet" href="_mockup.css">
  <style>
    .empty-hero { margin-top:16px; padding:17px 15px; background:var(--paper-shade); border-left:4px solid var(--gold); }
    .empty-title { margin:0; color:var(--brand-deep); font-size:22px; line-height:1.35; }
    .empty-copy { margin-top:7px; color:var(--text-2); font-size:12px; line-height:1.75; }
    .empty-actions { margin-top:16px; display:flex; flex-direction:column; gap:8px; }
    .privacy-note { margin-top:14px; padding-top:12px; border-top:1px solid rgba(43,36,34,.16); }
  </style>
</head>
<body>
  <div class="statusbar"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi"></span><span class="battery"></span></span></div>
  <div class="navbar"><span class="nav-back">‹</span><span class="nav-title">我的课表</span><span class="nav-capsule"><i></i><i></i><b></b></span></div>
  <main class="page">
    <div class="eyebrow">按节次展示 · 只保存你提供的课程</div>
    <h1 class="page-title">我的课表</h1>
    <section class="empty-hero">
      <h2 class="empty-title">还没有课表</h2>
      <div class="empty-copy">可以导入教务系统导出的 Excel 或课表截图，也可以手工添加课程。导入内容会先校对。</div>
    </section>
    <div class="empty-actions"><button class="primary" style="justify-content:center">导入课表文件</button><button class="secondary">手工新增课程</button></div>
    <div class="quiet privacy-note">课表只存你自己的内容，按微信身份隔离；本产品不接入教务账号。</div>
    <div class="back-link">返回首页</div>
  </main>
</body>
</html>
