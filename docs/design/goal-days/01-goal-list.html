<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>目标日 · 列表</title>
  <link rel="stylesheet" href="_tokens.css">
  <link rel="stylesheet" href="_mockup.css">
  <style>
    /* 一组一条，状态分组：未到期 / 今天 / 已过期。分组标题带条数，空的分组不画。 */
    .goal-group { margin-top: 20px; }
    .goal-group-head { display:flex; align-items:baseline; justify-content:space-between; }
    .goal-group-note { color:var(--text-3); font-size:11px; }

    .goal-item { margin-top:8px; padding:11px 12px; border-left:3px solid var(--gold); background:rgba(255,255,255,.62); border-top:1px solid rgba(43,36,34,.13); border-right:1px solid rgba(43,36,34,.13); border-bottom:1px solid rgba(43,36,34,.13); }
    .goal-item-today { border-left-color:var(--brand); }
    .goal-item-expired { border-left-color:#c68a32; background:var(--paper-shade); }
    .goal-item-top { display:flex; align-items:flex-start; gap:10px; }
    .goal-name { flex:1; min-width:0; color:var(--text); font-size:15px; font-weight:600; line-height:1.4; }
    .goal-state { flex:none; min-height:22px; padding:2px 8px; display:flex; align-items:center; border-radius:3px; font-size:10px; font-weight:700; }
    .goal-state-upcoming { color:var(--brand-ink); border:1px solid rgba(198,154,40,.55); background:rgba(198,154,40,.12); }
    .goal-state-today { color:#fff; background:var(--brand); }
    .goal-state-expired { color:var(--warn); border:1px solid var(--warn-line); background:var(--warn-soft); }
    .goal-meta { margin-top:5px; color:var(--text-2); font-size:11px; line-height:1.6; }
    /* 修改 / 删除两键显式定宽：原生 button 自带内在宽度，不限宽会把行挤变形。 */
    .goal-actions { margin-top:9px; display:flex; gap:7px; }
    .goal-actions button { width:62px; min-height:32px; display:flex; align-items:center; justify-content:center; border:1px solid rgba(43,36,34,.2); color:var(--brand-ink); font-size:11px; }
    .goal-actions .goal-delete { color:var(--warn); border-color:var(--warn-line); }

    .goal-new { margin-top:22px; width:100%; justify-content:center; font-size:15px; }
    .goal-note { margin-top:22px; padding-top:12px; border-top:1px solid rgba(43,36,34,.17); }
  </style>
</head>
<body>
  <div class="statusbar"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi"></span><span class="battery"></span></span></div>
  <div class="navbar"><span class="nav-back">‹</span><span class="nav-title">目标日</span><span class="nav-capsule"><i></i><i></i><b></b></span></div>
  <main class="page">
    <div class="eyebrow">只保存在这台设备 · 不联网、不上传</div>
    <h1 class="page-title">目标日</h1>
    <p class="copy">考试、报名截止、项目节点都可以记在这里。日期按北京时间的当天计算，今天就是今天。</p>

    <section class="goal-group">
      <div class="goal-group-head"><span class="section-title">未到期</span><span class="goal-group-note">2 个</span></div>

      <article class="goal-item">
        <div class="goal-item-top">
          <div class="goal-name">计算机二级考试</div>
          <div class="goal-state goal-state-upcoming">还有 67 天</div>
        </div>
        <div class="goal-meta">2026-12-05 · 不计入当天</div>
        <div class="goal-actions"><button>修改</button><button class="goal-delete">删除</button></div>
      </article>

      <article class="goal-item">
        <div class="goal-item-top">
          <div class="goal-name">普通话水平测试报名截止</div>
          <div class="goal-state goal-state-upcoming">还有 18 天</div>
        </div>
        <div class="goal-meta">2026-10-16 · 计入当天（今天也算 1 天）</div>
        <div class="goal-actions"><button>修改</button><button class="goal-delete">删除</button></div>
      </article>
    </section>

    <section class="goal-group">
      <div class="goal-group-head"><span class="section-title">今天</span><span class="goal-group-note">1 个</span></div>
      <article class="goal-item goal-item-today">
        <div class="goal-item-top">
          <div class="goal-name">体测补测</div>
          <div class="goal-state goal-state-today">就是今天</div>
        </div>
        <div class="goal-meta">2026-09-29</div>
        <div class="goal-actions"><button>修改</button><button class="goal-delete">删除</button></div>
      </article>
    </section>

    <section class="goal-group">
      <div class="goal-group-head"><span class="section-title">已过期</span><span class="goal-group-note">1 个</span></div>
      <article class="goal-item goal-item-expired">
        <div class="goal-item-top">
          <div class="goal-name">英语四级报名截止</div>
          <div class="goal-state goal-state-expired">已过期 4 天</div>
        </div>
        <div class="goal-meta">2026-09-25</div>
        <div class="goal-actions"><button>修改</button><button class="goal-delete">删除</button></div>
      </article>
    </section>

    <button class="primary goal-new">＋ 新建目标日</button>
    <div class="quiet goal-note">目标日只存在本机，换设备或删除小程序后不再恢复；这里的日期由你填写，不代表学校已公布的安排。</div>
  </main>
</body>
</html>
