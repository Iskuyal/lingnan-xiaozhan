<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>目标日 · 过期与删除确认</title>
  <link rel="stylesheet" href="_tokens.css">
  <link rel="stylesheet" href="_mockup.css">
  <style>
    .goal-group-head { display:flex; align-items:baseline; justify-content:space-between; }
    .goal-group-note { color:var(--text-3); font-size:11px; }
    .goal-item { margin-top:8px; padding:11px 12px; border-left:3px solid #c68a32; background:var(--paper-shade); border-top:1px solid rgba(43,36,34,.13); border-right:1px solid rgba(43,36,34,.13); border-bottom:1px solid rgba(43,36,34,.13); }
    .goal-item-top { display:flex; align-items:flex-start; gap:10px; }
    .goal-name { flex:1; min-width:0; font-size:15px; font-weight:600; line-height:1.4; }
    .goal-state { flex:none; min-height:22px; padding:2px 8px; display:flex; align-items:center; border-radius:3px; font-size:10px; font-weight:700; color:var(--warn); border:1px solid var(--warn-line); background:var(--warn-soft); }
    .goal-meta { margin-top:5px; color:var(--text-2); font-size:11px; }
    .goal-actions { margin-top:9px; display:flex; gap:7px; }
    .goal-actions button { width:62px; min-height:32px; display:flex; align-items:center; justify-content:center; border:1px solid rgba(43,36,34,.2); color:var(--brand-ink); font-size:11px; }
    .goal-actions .goal-delete { color:var(--warn); border-color:var(--warn-line); background:rgba(255,244,228,.7); }

    /* 删除确认：底部弹层，遮罩压住列表但仍能看见要删的是哪一条。
       用绝对定位的 stage 而不是 fixed：全页截图下 fixed 元素会落到视口外，评审图里就看不到弹层。 */
    .stage { position:relative; height:620px; overflow:hidden; }
    .overlay { position:absolute; inset:0; background:rgba(43,36,34,.42); }
    .sheet { position:absolute; left:0; right:0; bottom:0; padding:18px 18px 20px; background:var(--paper); border-top:3px solid var(--brand); }
    .sheet-title { color:var(--brand-deep); font-size:18px; font-weight:700; }
    .sheet-copy { margin-top:8px; color:var(--text-2); font-size:13px; line-height:1.8; }
    .sheet-target { margin-top:10px; padding:10px 11px; border-left:3px solid var(--warn); background:var(--warn-soft); color:var(--text-2); font-size:12px; }
    .sheet-actions { margin-top:16px; display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .sheet-actions button { min-height:46px; display:flex; align-items:center; justify-content:center; font-size:14px; }
    .sheet-cancel { border:1px solid rgba(43,36,34,.2); color:var(--text-2); }
    .sheet-confirm { background:var(--brand); color:#fff; font-weight:700; }
  </style>
</head>
<body>
  <div class="stage">
  <div class="statusbar"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi"></span><span class="battery"></span></span></div>
  <div class="navbar"><span class="nav-back">‹</span><span class="nav-title">目标日</span><span class="nav-capsule"><i></i><i></i><b></b></span></div>
  <main class="page">
    <div class="eyebrow">只保存在这台设备 · 不联网、不上传</div>
    <h1 class="page-title">目标日</h1>
    <p class="copy">已过期的目标日不会自动消失：它们留在下面，标出过期了几天，需要你自己决定删掉还是留着。</p>

    <section style="margin-top:20px">
      <div class="goal-group-head"><span class="section-title">已过期</span><span class="goal-group-note">2 个</span></div>

      <article class="goal-item">
        <div class="goal-item-top">
          <div class="goal-name">英语四级报名截止</div>
          <div class="goal-state">已过期 4 天</div>
        </div>
        <div class="goal-meta">2026-09-25</div>
        <div class="goal-actions"><button>修改</button><button class="goal-delete">删除</button></div>
      </article>

      <article class="goal-item">
        <div class="goal-item-top">
          <div class="goal-name">开学第一周交材料</div>
          <div class="goal-state">已过期 11 天</div>
        </div>
        <div class="goal-meta">2026-09-18</div>
        <div class="goal-actions"><button>修改</button><button class="goal-delete">删除</button></div>
      </article>
    </section>
  </main>

  <div class="overlay"></div>
  <section class="sheet">
    <div class="sheet-title">删除这个目标日？</div>
    <div class="sheet-copy">删除后无法恢复。目标日只存在本机，没有云端备份可以找回。</div>
    <div class="sheet-target">英语四级报名截止 · 2026-09-25</div>
    <div class="sheet-actions">
      <button class="sheet-cancel">取消</button>
      <button class="sheet-confirm">删除</button>
    </div>
  </section>
  </div>
</body>
</html>
