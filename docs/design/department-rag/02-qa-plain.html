<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>02 基础问题：不检索、无来源条</title>
  <link rel="stylesheet" href="_tokens.css">
  <link rel="stylesheet" href="_mockup.css">
</head>
<body>
  <div class="mock">
    <p class="title">部门问答 · 基础问题（不触发检索）</p>
    <p class="caption">联系方式、校区、下设部门等基础问题由随包全量语料回答，不做动态检索，回答下方不出现来源条——避免「问联系方式却挂一列动态来源」的噪声。</p>

    <div class="qa-head">
      <span class="qa-badge">AI 助手</span>
      <span class="qa-head-note">只依据官网已核实资料回答</span>
    </div>

    <div class="qa-row qa-row-user">
      <div class="qa-bubble qa-bubble-user">校学生团委的联系方式是什么？</div>
    </div>
    <div class="qa-row">
      <div class="qa-bubble qa-bubble-assistant">官网未公布。</div>
    </div>
  </div>
</body>
</html>
