<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>澄清与失败保留输入</title><link rel="stylesheet" href="_tokens.css"><link rel="stylesheet" href="_mockup.css"></head><body><nav>备考计划</nav><div class="draft">待评审设计图 · 虚构示例 · 不是运行截图</div><main><h1>先把情况说清楚</h1><div class="input">我晚上八点以后没空，每次练十分钟。</div><section class="card gold"><h2>这次还不能生成</h2><p>目前支持每段15–180分钟，时段按节次安排。请调整时长，并改成“晚上不排”等可核对的时段。</p><p class="muted">没有替你放宽约束，没有生成或覆盖保存的计划。</p></section><div class="primary">修改后再让AI理解</div><div class="secondary">使用基础规则排程</div><section class="card"><h2>如果AI暂时不可用</h2><p>保留当前输入和已保存计划，显示具体失败原因；可重试，也可明确选择规则排程。</p></section></main><div class="foot">安全拒绝、额度不足、网络/模型失败分别沿用服务端提示，不合并成同一句。</div></body></html>
