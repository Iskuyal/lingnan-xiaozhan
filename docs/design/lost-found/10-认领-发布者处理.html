<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>10 认领核验 · 发布者处理</title>
<link rel="stylesheet" href="_tokens.css"><link rel="stylesheet" href="_mockup.css"></head>
<body><div class="mock">
  <p class="doc-title">10 认领核验 · 发布者处理（待处理 / 需补充 / 通过）</p>
  <p class="doc-caption">发布者看到结构化核验回答；通过后进入交接确认，拒绝与「需补充」都要记录原因。归属永远由发布者人工判断。</p>
  <div class="nav"><div class="nav-title">认领核验</div><div class="nav-sub">你是发布者 · 请人工核对</div></div>
  <div class="card">
    <div class="card-head"><span class="badge badge-warn">待核验</span><span class="badge badge-status">申请 #3</span></div>
    <div class="card-title">关系：本人遗失</div>
    <div class="card-desc">核验回答：充电仓背面贴蓝色圆形贴纸，右耳塞内侧编号 08。</div>
    <div class="card-meta"><span>提交于 09-26 14:02</span></div>
    <div class="btn-row" style="margin-top:10px"><div class="btn btn-ghost">需补充</div><div class="btn btn-primary">通过</div></div>
    <div class="btn-row" style="margin-top:8px"><div class="btn btn-plain">拒绝（记录原因）</div></div>
  </div>
  <div class="card">
    <div class="card-head"><span class="badge badge-warn">需补充</span><span class="badge badge-status">申请 #2</span></div>
    <div class="card-desc">核验回答：耳机是白色的。</div>
    <div class="note" style="margin:10px 0 0">你的补充要求：请说明充电仓或耳塞上的独有特征。对方补充后回到待核验。</div>
  </div>
  <div class="card">
    <div class="card-head"><span class="badge badge-status">已通过</span><span class="badge badge-status">申请 #1</span></div>
    <div class="card-desc">核验回答：卡套背面有蓝色贴纸，编号后三位 217。</div>
    <div class="card-meta"><span>等待双方确认交接</span></div>
  </div>
</div></body></html>
