<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>11 我的失物招领</title>

<body><div class="mock">
  <p class="doc-title">11 我的失物招领 · 我的发布 / 我的认领</p>
  <p class="doc-caption">两个页签：我的发布（各状态徽标：匹配中/待核验/已结案/已关闭）与我的认领（待核验/需补充/已通过/已拒绝）。空状态为「还没有发布/认领记录」。</p>
  <div class="nav"><div class="nav-title">我的失物招领</div><div class="nav-sub">发布与认领都在这里跟进</div></div>
  <div class="seg"><div class="seg-item on">我的发布</div><div class="seg-item">我的认领</div></div>
  <div class="card">
    <div class="card-head"><span class="badge badge-lost">丢失</span><span class="badge badge-warn">待核验</span></div>
    <div class="card-title">丢失一副白色蓝牙耳机（含充电仓）</div>
    <div class="card-meta"><span>09-25 · 中午</span><span>1 条认领申请待处理</span></div>
  </div>
  <div class="card">
    <div class="card-head"><span class="badge badge-found">拾获</span><span class="badge badge-status">已结案</span></div>
    <div class="card-title">在图书馆二楼捡到一张校园卡</div>
    <div class="card-meta"><span>09-26 · 已与认领人完成交接</span></div>
  </div>
  <div class="card">
    <div class="card-head"><span class="badge badge-found">拾获</span><span class="badge badge-status">已关闭</span></div>
    <div class="card-title">捡到一把钥匙</div>
    <div class="card-meta"><span>已找到失主 · 关闭原因可查看</span></div>
  </div>
</div></body></html>
