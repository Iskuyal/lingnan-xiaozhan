<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>06 帖子详情 · 自己发布 / 已关闭</title>
<link rel="stylesheet" href="_tokens.css"><link rel="stylesheet" href="_mockup.css"></head>
<body><div class="mock">
  <p class="doc-title">06 帖子详情 · 自己发布（含私密特征）与已关闭</p>
  <p class="doc-caption">左：帖主视角——可见自己的私密核验特征（明确标注「仅你可见」）、候选入口、编辑与关闭操作。右：已关闭态——不再接受认领与匹配，显示关闭原因。</p>
  <div class="nav"><div class="nav-title">帖子详情</div><div class="nav-sub">这是你发布的帖子</div></div>
  <div class="card">
    <div class="card-head"><span class="badge badge-lost">丢失</span><span class="badge">电子设备</span><span class="badge badge-status">匹配中</span></div>
    <div class="card-title">丢失一副白色蓝牙耳机（含充电仓）</div>
    <div class="card-desc">充电仓上有贴纸，位置在三教到食堂之间路段。</div>
    <div class="card-meta"><span>09-25 · 中午</span><span>清远校区 · 三教-食堂</span></div>
  </div>
  <div class="card">
    <div class="card-head"><span class="badge badge-warn">仅你可见</span></div>
    <div class="card-desc">核验特征：充电仓背面贴蓝色圆形贴纸，右耳塞内侧有编号 08。</div>
  </div>
  <div class="btn-row"><div class="btn btn-ghost">查看候选线索</div><div class="btn btn-primary">编辑</div></div>
  <div class="btn-row"><div class="btn btn-plain">关闭帖子</div></div>
  <div class="note" style="margin-top:24px">已关闭的帖子示例：不再接受认领与匹配，显示关闭原因「物品已自行找到」。</div>
</div></body></html>
