<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>12 交接与结案</title>
<link rel="stylesheet" href="_tokens.css"><link rel="stylesheet" href="_mockup.css"></head>
<body><div class="mock">
  <p class="doc-title">12 交接与结案 · 双方确认 / 争议</p>
  <p class="doc-caption">左：脱敏交接建议（公共场所、不公开联系方式）+ 双方确认步骤；双方都确认才结案，单方确认显示待对方状态。右：争议入口——进入争议后不自动结案，等待人工处理。</p>
  <div class="nav"><div class="nav-title">交接与结案</div><div class="nav-sub">平台只记录确认，不担保交易</div></div>
  <div class="card">
    <div class="card-head"><span class="badge badge-status">申请已通过</span></div>
    <div class="steps">
      <div class="step"><span class="step-dot done"></span>认领核验通过</div>
      <div class="step"><span class="step-dot done"></span>发布者已确认交接</div>
      <div class="step"><span class="step-dot"></span>等待认领人确认交接</div>
    </div>
  </div>
  <div class="note-info">交接建议：请选择公共场所（如图书馆服务台、保卫处），当面核对物品；平台不展示双方联系方式，交接方式由双方线下协商。</div>
  <div class="btn-row"><div class="btn btn-primary">确认交接</div><div class="btn btn-plain">有争议？</div></div>
  <div class="note" style="margin-top:24px">争议态示例：双方对交接有分歧时进入争议，等待人工处理；处理完成后可结案或取消。</div>
</div></body></html>
