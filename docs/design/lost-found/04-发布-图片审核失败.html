<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>04 发布向导 · 图片审核失败</title>
<link rel="stylesheet" href="_tokens.css"><link rel="stylesheet" href="_mockup.css"></head>
<body><div class="mock">
  <p class="doc-title">04 发布向导 · 图片审核失败</p>
  <p class="doc-caption">图片未通过内容安全检测时：明确提示换一张或删除该图，其余表单内容保留不丢；审核结果只提示不展示检测细节。</p>
  <div class="nav"><div class="nav-title">发布信息</div><div class="nav-sub">丢失或拾获都从这里开始</div></div>
  <div class="form">
    <div class="field"><div class="field-label"><span class="req">*</span> 公开描述</div>
      <textarea class="input textarea">在图书馆二楼捡到一张校园卡</textarea></div>
    <div class="note">第 1 张图片没有通过内容安全检测，已从本次发布中移除；请更换或删除后重试。</div>
    <div class="field"><div class="field-label">图片（≤3 张）</div>
      <div class="note-info">第 1 张：⚠ 未通过，已移除 · 第 2 张：已就绪 · 点击继续添加</div></div>
  </div>
  <div class="btn-row"><div class="btn btn-plain">存草稿</div><div class="btn btn-primary">发布</div></div>
</div></body></html>
