<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>09 认领核验 · 提交表单（认领人）</title>
<link rel="stylesheet" href="_tokens.css"><link rel="stylesheet" href="_mockup.css"></head>
<body><div class="mock">
  <p class="doc-title">09 认领核验 · 认领人提交</p>
  <p class="doc-caption">结构化表单而非自由聊天：提示认领人提交只有失主才知道的特征（系统不知道特征内容，只做服务端受控比较）。同一帖子同一人只能有一条活跃申请。</p>
  <div class="nav"><div class="nav-title">认领申请</div><div class="nav-sub">请提供能证明物品属于你的信息</div></div>
  <div class="form">
    <div class="field"><div class="field-label"><span class="req">*</span> 你与该物品的关系</div>
      <input class="input" placeholder="例如：本人遗失 / 代同学认领（需说明）"></div>
    <div class="field"><div class="field-label"><span class="req">*</span> 未公开的核验信息</div>
      <textarea class="input textarea" placeholder="只有失主才知道的特征：颜色细节、划痕、编号局部、内部物品等"></textarea>
      <div class="field-hint">不要在这里填写手机号、微信号；核验通过后由双方协商交接</div></div>
    <div class="field"><div class="field-label">补充证据（可选）</div>
      <div class="note-info">可上传相关图片（如挂失回执、物品照片）</div></div>
  </div>
  <div class="note-info">你的核验信息只展示给发布者本人用于核验；平台不做自动归属判定。</div>
  <div class="btn-row"><div class="btn btn-plain">取消</div><div class="btn btn-primary">提交申请</div></div>
</div></body></html>
