<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>01 失物招领首页 · 正常</title>
<link rel="stylesheet" href="_tokens.css"><link rel="stylesheet" href="_mockup.css"></head>
<body><div class="mock">
  <p class="doc-title">01 失物招领首页 · 正常</p>
  <p class="doc-caption">丢失/拾获切换 + 类别/时间/地点筛选 + 结果列表 + 发布入口。列表只展示公开特征：类别、标题、公开描述、模糊时间与区域，无联系方式、无精确位置。</p>
  <div class="nav">
    <div class="nav-title">失物招领</div>
    <div class="nav-sub">只做匹配与线索，不代判归属 · 请勿公开联系方式</div>
  </div>
  <div class="seg"><div class="seg-item on">拾获</div><div class="seg-item">丢失</div></div>
  <div class="filters">
    <span class="chip on">全部类别</span><span class="chip">证件</span><span class="chip">电子设备</span><span class="chip">校园卡</span><span class="chip">近 7 天</span><span class="chip">清远校区</span>
  </div>
  <div class="card">
    <div class="card-head"><span class="badge badge-found">拾获</span><span class="badge">校园卡</span></div>
    <div class="card-title">在图书馆二楼捡到一张校园卡</div>
    <div class="card-desc">卡片放在二楼东侧窗边桌子上，已交给一楼服务台。</div>
    <div class="card-meta"><span>09-26 · 下午</span><span>清远校区 · 图书馆</span><span>待认领</span></div>
  </div>
  <div class="card">
    <div class="card-head"><span class="badge badge-lost">丢失</span><span class="badge">电子设备</span></div>
    <div class="card-title">丢失一副白色蓝牙耳机（含充电仓）</div>
    <div class="card-desc">充电仓上有贴纸，位置在三教到食堂之间路段。</div>
    <div class="card-meta"><span>09-25 · 中午</span><span>清远校区 · 三教-食堂</span><span>匹配中</span></div>
  </div>
  <div class="btn-row"><div class="btn btn-primary">+ 发布信息</div></div>
</div></body></html>
