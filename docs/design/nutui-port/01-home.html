<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>着陆页</title>
  <link rel="stylesheet" href="_tokens.css">
  <link rel="stylesheet" href="_mockup.css">
  <style>
    /* 首页：主视觉与入口结构沿用 campus-refresh；字号与间距全部走 nutui-port 令牌阶梯。 */
    .home-hero { margin: -24px -18px 0; padding: var(--sp-6) 18px var(--sp-5); min-height: 224px; position: relative; overflow: hidden; background: var(--brand-deep); color: #fff; }
    .home-kicker { color: rgba(255,255,255,.76); font-size: var(--fs-cap); }
    .home-name { max-width: 230px; margin-top: var(--sp-2); color: #fff; font-size: var(--fs-display); line-height: 1.4; font-weight: 700; }
    .home-campus { margin-top: var(--sp-1); color: rgba(255,255,255,.79); font-size: var(--fs-cap); }
    .home-hero-copy { max-width: 210px; margin-top: var(--sp-4); color: #fff; font-size: var(--fs-base); line-height: 1.75; }
    .hero-art { position: absolute; right: var(--sp-4); bottom: var(--sp-1); }
    .hero-foot { margin-top: var(--sp-3); display: flex; align-items: center; gap: var(--sp-2); color: rgba(255,255,255,.7); font-size: var(--fs-cap); }
    .gold-square { width: 7px; height: 7px; background: var(--gold); }

    /* 入口主按钮：高度取 NutUI --nut-button-block-height 48px，内距取 --nut-cell-padding 节奏 */
    .entry-main { display: flex; width: 100%; margin-top: var(--sp-4); padding: var(--sp-4); min-height: var(--h-btn-lg); background: var(--brand); color: #fff; border-radius: var(--r-control); position: relative; text-align: left; }
    .entry-label { display: block; color: rgba(255,255,255,.76); font-size: var(--fs-cap); }
    .entry-title { display: block; margin-top: 3px; font-size: var(--fs-display); line-height: 1.35; font-weight: 700; }
    .entry-desc { display: block; margin-top: 3px; color: rgba(255,255,255,.82); font-size: var(--fs-sm); }
    .action-arrow { position: absolute; right: var(--cell-pad-x); top: 30px; font-size: 19px; line-height: 1; }
    .entry-pair { display: grid; grid-template-columns: 1fr 1.18fr; gap: var(--sp-3); margin-top: var(--sp-3); }
    .entry-mini { min-height: 76px; padding: var(--sp-3); text-align: left; background: rgba(255,255,255,.62); border: 1px solid rgba(43,36,34,.14); border-radius: var(--r-cell); }
    .entry-mini:first-child { border-top: 3px solid var(--gold); }
    .entry-mini:last-child { border-top: 3px solid var(--brand-deep); }
    .entry-mini strong { display: block; color: var(--brand-deep); font-size: var(--fs-lg); }
    .entry-mini span { color: var(--text-3); font-size: var(--fs-cap); }
    .about { padding: var(--sp-4); background: rgba(255,255,255,.56); border-left: 3px solid var(--gold); border-radius: var(--r-cell); }
    .source-block { margin-top: var(--sp-5); padding-top: var(--sp-3); border-top: 1px solid rgba(43,36,34,.17); }
    .source-link { margin-top: var(--sp-3); color: var(--brand-ink); font-size: var(--fs-sm); }
  </style>
</head>
<body>
  <div class="statusbar"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi"></span><span class="battery"></span></span></div>
  <div class="navbar"><span class="nav-back"></span><span class="nav-title">校园工具</span><span class="nav-capsule"><i></i><i></i><b></b></span></div>
  <main class="page">
    <section class="home-hero">
      <div class="home-kicker">校园信息与日常服务</div>
      <div class="home-name">广东岭南职业技术学院</div>
      <div class="home-campus">广州校区 / 清远校区</div>
      <div class="home-hero-copy">读资讯、找组织、查课表。</div>
      <div class="hero-foot"><i class="gold-square"></i>校园里的事，从这里进入</div>
      <img class="pixel-gate hero-art" src="lingnan-gate.svg" alt="">
    </section>

    <button class="entry-main"><span><small class="entry-label">我的安排</small><strong class="entry-title">打开课表</strong><span class="entry-desc">导入课程，按周查看</span></span><span class="action-arrow">›</span></button>
    <div class="entry-pair">
      <button class="entry-mini"><strong>学生部门</strong><span>查看组织名录</span></button>
      <button class="entry-mini"><strong>校园资讯</strong><span>阅读官网动态与通知</span></button>
    </div>

    <div class="section-head"><span class="section-title">最近动态</span><span class="section-note">校园资讯</span></div>
    <div class="cell-group">
      <button class="cell">
        <span class="cell-main">
          <span class="cell-desc">2026-09-12 · 学校官网</span>
          <span class="cell-title">向“新”而行，逐梦岭南——我校开展2026级新生入学教育</span>
        </span>
        <span class="cell-arrow">›</span>
      </button>
      <div class="cell">
        <span class="cell-main"><span class="cell-desc">内容由学校官网同步，查看时可复制原文链接核对。</span></span>
      </div>
    </div>

    <div class="section-head"><span class="section-title">认识岭南</span><span class="section-note">学校简介</span></div>
    <section class="about">
      <div class="copy">学校设有广州、清远两个校区，以大健康类专业为主体，同时开设电子信息、智能制造、财经商贸与文化艺术等领域专业。</div>
      <div class="source-block">
        <div class="quiet">资料来源：学校官网 · 学院简介</div>
        <div class="quiet">核查于 2026-09-17</div>
        <div class="source-link">复制官网链接</div>
      </div>
    </section>
    <div class="quiet" style="margin-top:24px;text-align:center">从了解校园，到安排每一天</div>
  </main>
</body>
</html>
