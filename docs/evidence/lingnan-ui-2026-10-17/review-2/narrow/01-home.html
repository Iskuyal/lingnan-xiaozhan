<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>320px 浏览器辅助检查</title><style>body{margin:0}div,button{box-sizing:border-box}button,input,textarea{font:inherit}img{height:auto}.native-nav{height:88px;padding:45px 10px 0;background:white;text-align:center;font-size:12px}.scope{padding:4px 12px;font-size:10px;background:#fff4e4;color:#78420e}button { min-width:0; max-width:100%; box-sizing:border-box; border-radius:8px; }

/**
 * 全局样式与设计令牌。
 * 岭南红与校徽金沿用项目确定的品牌色；纸白底、清晰分区和方正轮廓构成本次全模块改版。

body {
  --brand: #c41c23;
  --brand-deep: #8c1614;
  --brand-ink: #7a1a12;
  --gold: #c69a28;
  --gold-deep: #a67f1c;
  --paper: #fdf7f5;
  --paper-shade: #faeee9;

  --text: #2b2422;
  --text-2: #6b5d57;
  --text-3: #746760;
  --surface: #ffffff;
  --line: #ded4cf;
  --control-line: #aa9990;
  --success: #147a70;
  --success-soft: #e8f3f0;

  /* Legacy design tokens remain available to the archived timetable mockups; active page styles do not use glass. */
  --glass: rgba(255,255,255,0.52);
  --glass-strong: rgba(255,255,255,0.72);
  --glass-edge: rgba(255,255,255,0.92);
  --glass-line: rgba(255,255,255,0.62);
  --glass-divide: rgba(255,255,255,0.70);
  --glass-drop: rgba(92,28,26,0.13);
  --glass-drop-strong: rgba(140,22,20,0.26);
  --glass-blur: 16px;
  --r-chip: 5.12px;
  --r-control: 8.533333333333333px;
  --r-card: 10.24px;
  --r-panel: 13.653333333333334px;
  --r-pill: 426.24px;

  --warn: #9a5b1e;
  --warn-soft: rgba(255,244,228,0.86);
  --warn-line: rgba(214,160,90,0.55);

  /* 课程颜色由 services/timetable/palette.ts 提供，以下仅为内联槽失效时的兜底。 */
  --blk-tint: rgba(255,255,255,0.72);
  --blk-line: rgba(255,255,255,0.62);
  --blk-solid: rgba(148,134,127,0.55);

  background: var(--paper, #fdf7f5);
  color: var(--text, #2b2422);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.65;
}

.home-footer { margin-top:34px; text-align:center; font-size:11px; color:var(--text-3, #746760); }
@media (max-width:350px) { .home-title { font-size:21px; } .home-brand { padding:10px 14px; } .entry-main .entry-title { font-size:14px; } }
