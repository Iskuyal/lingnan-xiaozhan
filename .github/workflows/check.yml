name: 小程序检查
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: 验证云函数锁文件可干净安装
        run: |
          for function in ai timetable newsSync; do
            npm ci --ignore-scripts --prefix "cloudfunctions/$function"
          done
      - name: 检查文档链接与锚点
        run: npm run docs:check
      - run: npm run typecheck
      - run: npm test
      - name: 审计锁定依赖
        run: |
          npm audit --audit-level=low
          for function in ai timetable newsSync; do
            npm audit --audit-level=low --prefix "cloudfunctions/$function"
          done
